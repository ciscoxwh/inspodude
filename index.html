<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inspodude</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #fff;
        font-family: "Patrick Hand", Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
      }

      .version {
        position: fixed;
        bottom: 8px;
        left: 0;
        right: 0;
        font-size: 0.9em;
        color: #888;
      }
      .container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .top-half {
        height: 50%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 10px;
      }

      .bottom-half {
        height: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 10px;
      }

      .scene {
        position: relative;
        width: min(420px, 80vw);
        aspect-ratio: 1 / 1;
      }

      .dialogue {
        max-width: 66.67vw;
        margin: 0 auto;
        line-height: 1.4em;
        font-size: 1.3em;
      }

      .response {
        text-indent: 2em;
        margin: 0;
      }

      .quote {
        text-indent: 4em;
        margin: 0;
        font-weight: bold;
      }

      .buttons {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      button {
        position: relative;
        background: transparent;
        border: 10px;
        color: #000;
        padding: 36px 18px;
        min-width: 140px;
        cursor: pointer;
        font-size: 1.2em;
        font-family: "Patrick Hand", Arial, sans-serif;
      }

      button::before {
        content: "";
        position: absolute;
        inset: 0;
        background: lightpink;
        border: 7px solid #000;
        border-radius: 20px;
        z-index: 0;
        transform-origin: center center;
      }

      button:hover::before {
        background: darkpink;
      }

      button:not(.visited)::before {
        animation: jiggle 0.25s infinite;
        animation-delay: var(--jiggle-delay, 0s);
      }

      button.entering::before {
        animation: jiggle-enter 0.4s ease-out 1;
      }

      @keyframes jiggle {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(0.5deg);
        }
        50% {
          transform: rotate(0deg);
        }
        75% {
          transform: rotate(-0.5deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      @keyframes jiggle-enter {
        0% {
          transform: rotate(0deg);
        }
        10% {
          transform: rotate(4deg);
        }
        20% {
          transform: rotate(-4deg);
        }
        35% {
          transform: rotate(2.5deg);
        }
        50% {
          transform: rotate(-2deg);
        }
        65% {
          transform: rotate(1deg);
        }
        80% {
          transform: rotate(-0.5deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      button.visited::before {
        background: #c79ba0;
      }

      button .btn-label {
        position: relative;
        z-index: 1;
      }

      #bedImage {
        width: 100%;
        height: 100%;
        display: block;
      }

      .lilguy {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 37.04%;
        height: auto;
        transform: translateX(-50%);
      }

      .zzz {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        animation: zdrift 2s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }

      #z2 {
        animation-delay: 0.3s;
      }
      #z3 {
        animation-delay: 0.6s;
      }

      @keyframes zdrift {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-20px);
        }
      }

      #z1.waking,
      #z2.waking,
      #z3.waking {
        animation: zwake 0.7s cubic-bezier(0.4, 0, 1, 1) forwards;
        animation-delay: 0s;
      }

      #z1.waking {
        transform-origin: 92% 15%;
      }
      #z2.waking {
        transform-origin: 87% 10%;
      }
      #z3.waking {
        transform-origin: 81% 5%;
      }

      @keyframes zwake {
        0% {
          opacity: 1;
          transform: translateY(0) rotate(0deg);
        }
        6% {
          transform: translateY(-2px) rotate(3deg);
        }
        12% {
          transform: translateY(-4px) rotate(-3deg);
        }
        18% {
          opacity: 0.5;
          transform: translateY(-6px) rotate(3deg);
        }
        24% {
          opacity: 0;
          transform: translateY(-8px) rotate(-3deg);
        }
        30% {
          opacity: 0;
          transform: translateY(-12px) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: translateY(-160px) rotate(0deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="top-half">
        <div class="scene">
          <img id="bedImage" src="bed_lilguy.webp" alt="Inspodude in bed" />
          <img id="lilguy" class="lilguy" src="" alt="" style="display: none" />
          <img id="z1" class="zzz" src="z_1.webp" alt="" style="display: none" />
          <img id="z2" class="zzz" src="z_2.webp" alt="" style="display: none" />
          <img id="z3" class="zzz" src="z_3.webp" alt="" style="display: none" />
        </div>
      </div>
      <div class="bottom-half">
        <div class="dialogue" id="dialogueText"></div>
        <div class="buttons" id="buttonArea">
          <button id="wakeButton">Wake lil guy</button>
        </div>
      </div>
    </div>
    <div class="version">inspodude v0.1! june 17, 2026</div>

    <script src="script.js"></script>
  </body>
</html>
